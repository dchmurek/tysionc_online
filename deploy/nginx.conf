# /etc/nginx/sites-available/tysiac – odwrotne proxy z HTTPS i WebSocket.
# Certyfikat: sudo certbot --nginx -d tysiac.example.pl
server {
    listen 80;
    server_name tysiac.example.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tysiac.example.pl;

    ssl_certificate     /etc/letsencrypt/live/tysiac.example.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tysiac.example.pl/privkey.pem;

    client_max_body_size 25m;   # import kopii przez panel administratora

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
